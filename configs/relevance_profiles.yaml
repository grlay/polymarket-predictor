# Evidence-relevance profiles (shared-spec Layer 3, stage 1: HAND-WRITTEN).
#
# One profile per storyline, written from the market QUESTION only (never from outcomes or prices) and matched to
# every deadline variant of that storyline by `question_regex`. A document is accepted for a profiled market only if
#   - it was published at or before the snapshot cutoff and inside the window,
#   - it mentions at least one entity, and
#   - it mentions at least one institution term or action term.
# Each rejected document gets exactly one reason: after_cutoff, outside_window, no_entity, no_institution_or_action.
# If no document is accepted, the forecast is skipped with `insufficient_relevant_evidence` and no LLM call is made.
#
# Term syntax: whole words, case-insensitive. A trailing * means "any word starting with this", for example
# "resign*" matches resign, resigns, resignation. Use explicit forms where a prefix would match an unrelated word
# ("depart*" would match "department", so "depart", "departs", ... are listed instead).
#
# These profiles are NOT validated yet: precision and recall have to be measured on a hand-labelled audit set before
# they are described as a method. The file is hashed into the forecast run identity, so changing it starts a new
# versioned run. Record every change in docs/decisions_log.md BEFORE looking at outcomes.
version: 1
profiles:
  - id: rubio_departure
    subtype: executive_personnel_departure
    question_regex: '(?i)\bRubio\b.*\b(out|leave|leaves|left|exit|resign\w*)\b'
    window_days: 30
    entities: ["Rubio"]
    institution_terms: ["cabinet", "national security adviser", "shake-up", "shakeup"]
    # Revised 2026-11-07 after a check on 546 VM documents: the bare prefix "leav*" matched incidental body text
    # (a Cuba-sanctions piece), so it is replaced by phrases that say who leaves what.
    action_terms: ["resign*", "exit*", "depart", "departs", "departure", "departing", "departed",
                   "step down", "steps down", "stepping down", "stepped down", "oust*", "fired", "firing",
                   "replac*", "dismiss*", "quit", "quits", "quitting",
                   "leave jobs", "leave their jobs", "leave his job", "leave his jobs", "leave office", "leaves office",
                   "leaving office", "leave the administration", "leaving the administration", "leave the cabinet",
                   "leaving the cabinet"]

  - id: iran_blockade_end
    subtype: executive_foreign_policy_announcement
    question_regex: '(?i)\b(Iran|Iranian)\b.*\bblockade\b|\bblockade\b.*\bIran'
    window_days: 30
    # Tightened twice on 2026-11-07, both times because of observed false positives:
    #  1. 252 stored documents: generic action terms (negotiat*, talks, deal, agreement, announce*, end) accepted two
    #     Iran-commentary pieces that were not about the blockade.
    #  2. 546 VM documents: "ceasefire" (shared with the Russia-Ukraine story), "Strait" (a passing mention in a Hegseth
    #     piece) and "lift" (lifting sanctions) accepted unrelated Axios articles. A document that is really about the
    #     blockade contains the word "blockade" or names shipping/naval/Oman, so "lift" is redundant.
    # Recall is low by design: only a few documents in the corpus say "blockade"; Iran-war commentary is not accepted.
    entities: ["Iran*", "Hormuz", "Tehran"]
    institution_terms: ["blockade", "naval", "Navy", "Oman", "ports", "shipping", "tanker*"]
    action_terms: ["reopen*"]
